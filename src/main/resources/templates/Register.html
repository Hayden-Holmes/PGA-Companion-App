<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Register - Golf App', ~{::content})}">

<th:block th:fragment="content">
    <style>
        .auth-card {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
        }
        .auth-card h1 { font-size: 1.4rem; margin-bottom: 0.25rem; color: var(--green-dark); }
        .auth-card p  { font-size: 0.875rem; color: var(--gray-600); margin-bottom: 1.5rem; }
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--gray-900); }
        .auth-footer { margin-top: 1rem; font-size: 0.85rem; color: var(--gray-600); text-align: center; }
        .auth-footer a { color: var(--green-dark); }
    </style>

    <div class="auth-card">
        <h1>Create account</h1>
        <p>Join Golf Picks to track your players</p>

        <div th:if="${errorMessage}" class="flash-global error" th:text="${errorMessage}" style="border-radius:7px; margin-bottom:1rem;"></div>

        <form th:action="@{/register}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="devuser" required autofocus/>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required/>
            </div>
            <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Create account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</th:block>

</html>
